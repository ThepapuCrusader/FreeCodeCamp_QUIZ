<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="freeCodeCamp Accessibility Quiz practice project" /> <!-- La mitica descripcion de las paginas web -->
    <link rel="stylesheet" href="styles.css" />
    <title>Accessibility Quiz</title>
  </head>
  <body>
    <header>
      <img src="https://cdn.freecodecamp.org/platform/universal/fcc_primary.svg" id="logo" alt="freeCodeCamp"> <!-- alt="" es un atributo descriptivo para las imagenes -->
      <h1>HTML/CSS Quiz</h1>
      <nav>
        <ul>
          <li><a href="#student-info">INFO</a></li>
          <li><a href="#html-questions">HTML</a></li>
          <li><a href="#css-questions">CSS</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <form method="post" action="https://freecodecamp.org/practice-project/accessibility-quiz">
        <section role="region" aria-labelledby="student-info"> <!-- role="" sirve para dar a entender el proposito de el elemento que posea este atributo, usado principalmente por tecnologias de lectura de pantalla -->
          <h2 id="student-info">Student Info</h2>
          <div class="info">
            <label for="student-name">Name:</label>
            <input name="student-name" id="student-name" type="text" />
          </div>
          <div class="info">
            <label for="student-email">Email:</label>
            <input name="student-email" id="student-email" type="email"/>
          </div>
          <div class="info">
            <label for="birth-date">Date of Birth:</label>
            <input name="birth-date" id="birth-date" type="date"/>
          </div>
        </section>
        <section role="region" aria-labelledby="html-questions"> <!-- aria-labelledby="" define el nombre accesible de un elemento al reutilizar texto visible de la pagina que coincida con el atributo facilitando su identificacion-->
          <h2 id="html-questions">HTML Questions</h2>
          <div class="question-block">
            <h3><span class="sr-only">Question</span> 1</h3>
            <fieldset class="question"></fieldset>
          </div>
          <div class="question-block">
            <h3><span class="sr-only">Question</span> 2</h3>
            <fieldset class="question"></fieldset>
          </div>
        </section>
        <section role="region" aria-labelledby="css-questions">
          <h2 id="css-questions">CSS Questions</h2>
        </section>
      </form>
    </main>
  </body>
</html>
